name: Shopify Theme deploy

on:
 push:
  branches:
    - main

jobs:
  deploy:
    name: Deploy Shopify Theme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install Shopify CLI
        run: npm install -g @shopify/cli
    
      - name: debug secrets
        run: |
          echo "SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}"
          echo "SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}"
          echo "SHOPIFY_TEST: ${{ env.SHOPIFY_TEST }}"

      - name: Upload theme
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
          SHOPIFY_FLAG_FORCE: 1
          SHOPIFY_FLAG_THEME_ID: 161236549853
        run: |
          shopify theme push \
            --json \
            --store="$SHOPIFY_FLAG_STORE" \
            --password="$SHOPIFY_CLI_THEME_TOKEN" \
            --theme="$SHOPIFY_FLAG_THEME_ID"
